name: Release Stable

on:
  workflow_run:
    workflows: ["czsh - CI"]
    types: [completed]
    branches:
      - stable
      - staging

env:
  MIRROR_SSH_URL: ${{ vars.MIRROR_SSH_URL }}
  EXECUTABLES: ${{ vars.EXECUTABLES }}
  PRIVATE_SSH_KEY: ${{ secrets.PRIVATE_SSH_KEY }}
  CC: epiclang

jobs:
  check_mirror:
    environment: production
    runs-on: ubuntu-latest

    outputs:
      is_mirror: ${{ steps.check.outputs.is_mirror }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          ORIGIN=$(git remote get-url origin)
          ORIGIN=$(echo $ORIGIN | sed 's|https://github.com|git@github.com:|; s|$|.git|')
          ORIGIN=$(echo $ORIGIN | sed 's/com:\//com:/')

          echo "is_mirror=$( [ "$ORIGIN" = "$MIRROR_SSH_URL" ] && echo true || echo false )" >> $GITHUB_OUTPUT

  release:
    needs: check_mirror
    runs-on: ubuntu-latest
    container:
      image: lukassgx/epi-docker:tek1-extended

    if: needs.check_mirror.outputs.is_mirror == 'false' && github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: write
      pull-requests: write
      id-token: write
      issues: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: ${{ github.event.workflow_run.head_branch }}
          config-file: release-config.json
          manifest-file: .release-manifest.json

  release-artefact:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Build
        run: |
          make

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory /__w/C_zsh/C_zsh
          gh release upload ${{ needs.release.outputs.tag_name }} 42sh

      
  push_to_mirror:
    needs:
      - check_mirror
      - release
      - release-artefact

    environment: production
    runs-on: ubuntu-latest

    if: github.event.workflow_run.head_branch == 'stable'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ vars.MIRROR_SSH_URL }}
          ssh_private_key: ${{ secrets.PRIVATE_SSH_KEY }}
          ssh_username: git
